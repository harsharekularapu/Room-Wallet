<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room Wallet</title>
<meta name="theme-color" content="#0B8F7D">
<meta name="description" content="Personal and shared wallet tracker with UPI helpers.">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F8;--card:#fff;--ink:#12263F;--mute:#5F7186;--line:#D9E2EC;--acc:#0B8F7D;--accink:#fff;--bad:#D6452B;--track:#E3EAF1;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1722;--card:#15232F;--ink:#E7EEF5;--mute:#8CA0B3;--line:#25374A;--acc:#2CC4AE;--accink:#06231E;--bad:#FF7A5F;--track:#22384A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1722;--card:#15232F;--ink:#E7EEF5;--mute:#8CA0B3;--line:#25374A;--acc:#2CC4AE;--accink:#06231E;--bad:#FF7A5F;--track:#22384A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 4px}
.total{font-size:40px;font-weight:700;letter-spacing:-1px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 20px}
.w{background:var(--c);background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.wt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wn{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.wb{font-weight:700;font-size:22px}
.bar{height:8px;background:var(--track);border-radius:6px;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.bar.over i{background:var(--bad)}
.note{font-size:12px;color:var(--mute);margin:0 0 12px}
.note.over{color:var(--bad);font-weight:600}
.row{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,opacity .16s ease;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;font-weight:600;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.row button{flex:1}
h2{font-size:15px;margin:26px 0 10px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx b{display:block;font-size:14px;overflow-wrap:anywhere}
.tx small{color:var(--mute);font-size:12px}
.amt{font-weight:700;white-space:nowrap}
.amt.out{color:var(--bad)}
.amt.in{color:var(--acc)}
.x{border:0;padding:4px 8px;color:var(--mute);font-size:18px;line-height:1}
.empty{color:var(--mute);font-size:14px;padding:20px 0}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#ov.on{display:flex}
form{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
form h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.top h1{margin:0}.tr{display:flex;gap:8px;align-items:center}.chip{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}.sm{padding:6px 10px;font-size:13px}
#msp{margin:0 0 4px;color:var(--ink);font-weight:600}
.w .bar{background:rgba(255,255,255,.28)}.w .bar i{background:#fff}.w .bar.over i{background:#FFB4A2}.w .note{color:rgba(255,255,255,.88)}.w .note.over{color:#FFD2C8}.w button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
#chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.cp{white-space:nowrap;border-radius:999px;padding:8px 14px;font-size:13px}.cp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main:not([data-v="home"]) .vhome,main:not([data-v="pay"]) .vpay,main:not([data-v="hist"]) .vhist,main:not([data-v="stats"]) .vstats{display:none}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;z-index:3}
#nav button{flex:1;border:0;border-radius:12px;color:var(--mute)}#nav button.on{color:var(--acc)}#nav .sc{background:var(--acc);color:var(--accink);padding:12px}#nav .sc.on{color:var(--accink)}
.big{width:100%;margin-top:14px;padding:18px;font-size:18px;border-radius:14px}
#nav .sc{flex:1.5}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.sc2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}.sc2 small{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}.sc2 b{font-size:17px}
.sc2.hi{background:var(--acc);border-color:var(--acc);color:var(--accink)}.sc2.hi small{color:var(--accink);opacity:.85}
.ch{display:flex;gap:6px;align-items:flex-end;height:175px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px 8px}
.cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}.cc i{width:100%;max-width:30px;background:var(--acc);border-radius:6px 6px 2px 2px}.cc.td i{background:var(--ink)}.cv{font-size:10px;color:var(--mute)}.cl{font-size:11px;color:var(--mute)}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 2px;font-weight:600;font-size:14px}.dh span:last-child{color:var(--bad)}
.wr{margin:10px 0}.wr .tx{border:0;padding:0}
button:active{transform:scale(.975)}
.w,.sc2,.lockbox,#ov form{animation:riseIn .28s ease both}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.lockbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.18)}.lockbox h2{margin:0 0 6px}.lockbox p{color:var(--mute);font-size:13px;line-height:1.5}.lockerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.qrmeta{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}body.locked main,body.locked #nav{visibility:hidden}#lock.hide{display:none}
</style>

  window.addEventListener("load", function () {

  });
}

<body class="locked">
<main data-v="home">
<div class="top"><h1>Total balance</h1><div class="tr"><span id="chip" class="chip">Starting…</span><button id="bk" class="sm">Backup</button></div></div>
<p class="total" id="total">₹0</p>
<p class="sub" id="msp"></p>
<p class="sub">Money stays in your bank. Wallets only track it. Pay by UPI, then add the entry here. Each new month starts fresh and leftover money carries over.</p>
<div id="chips" class="vhome"></div>
<div id="list" class="vhome"></div>
<button id="newbtn" class="vhome pri" style="width:100%;padding:14px">New wallet</button>
<div class="vhist"><h2>History</h2><div style="display:flex;gap:8px"><input id="hsearch" placeholder="Search transactions…" aria-label="Search transactions" style="flex:1"><button id="hclear" type="button">Clear</button></div><div id="hist"></div></div>
<div class="vpay" id="payv"></div>
<div class="vstats" id="stats"></div>
</main>
<nav id="nav"><button data-v="home" class="on">Home</button><button data-v="stats">Stats</button><button data-v="pay" class="sc">Scan and pay</button><button data-v="hist">History</button></nav>
<div id="lock"><div class="lockbox"><h2 id="lockTitle">Room Wallet</h2><p id="lockSub">Create a room for your group, or join a room that already exists using its room name and password.</p><div id="roomMode" class="row" style="margin:12px 0"><button type="button" id="modeCreate" class="pri" style="flex:1">Create room</button><button type="button" id="modeJoin" style="flex:1">Join room</button></div><form id="lockForm"><label id="lockNameLabel">Account name</label><input id="lockName" autocomplete="organization" placeholder="Room / Family / Group name"><label>Password</label><input id="lockPass" type="password" autocomplete="new-password" placeholder="Shared account password"><label id="lockPass2Label">Confirm password</label><input id="lockPass2" type="password" autocomplete="new-password" placeholder="Repeat password"><div id="memberSetup"></div><div id="memberLogin" style="display:none"><label>Who are you?</label><select id="memberPick"></select></div><p id="lockErr" class="lockerr"></p><button id="lockBtn" class="pri" type="submit" style="width:100%;margin-top:10px">Create shared account</button></form></div></div>
<div id="ov"><form id="f"></form></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var CAM=null;
var SYNC_BASE=(localStorage.getItem("room-wallet-sync-url")||((location.protocol==="http:"||location.protocol==="https:")?location.origin:"")).replace(/\/$/,"");
var SYNC_TOKEN=localStorage.getItem("room-wallet-sync-token")||"";
var SYNC_ACCOUNT=localStorage.getItem("room-wallet-sync-account")||"";
var syncTimer=null, syncPollTimer=null, syncBusy=false;
function syncReq(path,opts){opts=opts||{};opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});if(SYNC_TOKEN)opts.headers.Authorization="Bearer "+SYNC_TOKEN;return fetch((SYNC_BASE||location.origin)+path,opts).then(function(r){return r.json().catch(function(){return {}}).then(function(d){if(!r.ok)throw new Error(d.error||"Sync failed");return d})})}
function applyRemoteState(remote){
 if(!remote||!Number.isFinite(Number(remote.updated)))return false;
 if(Number(remote.updated)>Number(S.updated||0)){
  S=remote;S.members=remote.members||S.members||[{id:"me",name:"Me"}];
  lastSaved=snap();try{localStorage.setItem("wallets-v1",lastSaved)}catch(e){}
  render();setChip("Synced");return true;
 }
 return false;
}
function startSyncPolling(){
 if(!SYNC_TOKEN||syncPollTimer)return;
 function poll(){if(!SYNC_TOKEN||syncBusy||document.hidden)return;syncBusy=true;syncReq("/api/state",{method:"GET"}).then(function(d){if(d&&d.state)applyRemoteState(d.state)}).catch(function(e){if(e&&/Session expired|Not signed in/i.test(e.message)){SYNC_TOKEN="";localStorage.removeItem("room-wallet-sync-token");setChip("Sync sign-in expired")}else setChip("Offline — saved locally")}).finally(function(){syncBusy=false})}
 poll();syncPollTimer=setInterval(poll,4000);
}
function syncNow(){if(!SYNC_TOKEN)return Promise.resolve();clearTimeout(syncTimer);return new Promise(function(resolve){syncTimer=setTimeout(function(){syncReq("/api/state",{method:"PUT",body:JSON.stringify({state:S})}).then(function(d){if(d.conflict&&d.state)applyRemoteState(d.state);else setChip("Synced")}).catch(function(e){if(e&&/Session expired|Not signed in/i.test(e.message)){SYNC_TOKEN="";localStorage.removeItem("room-wallet-sync-token");setChip("Sync sign-in expired")}else setChip("Sync failed — saved locally")}).finally(resolve)},300)})}
function loginSync(account,password,members,mode){if(!SYNC_BASE)return Promise.resolve(null);return syncReq("/api/sync",{method:"POST",body:JSON.stringify({account:account,password:password,members:members,state:S,mode:mode||"auto"})}).then(function(d){SYNC_TOKEN=d.token;SYNC_ACCOUNT=account;localStorage.setItem("room-wallet-sync-token",SYNC_TOKEN);localStorage.setItem("room-wallet-sync-account",account);return d})}

var COLORS=["#0B7A6B","#2F5FC4","#B86E0A","#9A3E9B","#C23B22","#3C8021"];var cur="all";
var S={wallets:[],tx:[],members:[{id:"me",name:"Me"}],hist:[]};
try{
  var raw=localStorage.getItem("wallets-v1");
  if(raw){
    var loaded=JSON.parse(raw);
    if(loaded&&Array.isArray(loaded.wallets)&&Array.isArray(loaded.tx)) S=loaded;
  }
}catch(e){}
S.wallets=Array.isArray(S.wallets)?S.wallets:[];
S.tx=Array.isArray(S.tx)?S.tx:[];
S.members=Array.isArray(S.members)&&S.members.length?S.members:[{id:"me",name:"Me"}];S.hist=Array.isArray(S.hist)?S.hist:[];S.tx=S.tx.filter(function(t){return t&&t.w&&Number.isFinite(Number(t.amt))&&Number(t.amt)>=0&&Number.isFinite(Number(t.t))});
var undoStack=[],redoStack=[],lastSaved="";
function snap(){return JSON.stringify(S)}
function save(){
  var before=lastSaved||snap(),now=snap();
  if(before!==now){undoStack.push(before);if(undoStack.length>50)undoStack.shift();redoStack=[]}
  S.updated=Math.max(Date.now(),Number(S.updated||0)+1);lastSaved=snap();
  try{localStorage.setItem("wallets-v1",lastSaved);setChip("Saved")}catch(e){setChip("Save failed")}
  refreshUndoButtons();push();syncNow()
}
function restore(raw){try{S=JSON.parse(raw);S.wallets=S.wallets||[];S.tx=S.tx||[];S.members=S.members&&S.members.length?S.members:[{id:"me",name:"Me"}];S.hist=S.hist||[];return true}catch(e){return false}}
function doUndo(){if(!undoStack.length)return;var cur=snap(),prev=undoStack.pop();redoStack.push(cur);if(restore(prev)){lastSaved=snap();localStorage.setItem("wallets-v1",lastSaved);render();setChip("Undone");refreshUndoButtons();syncNow()}}
function doRedo(){if(!redoStack.length)return;var cur=snap(),next=redoStack.pop();undoStack.push(cur);if(restore(next)){lastSaved=snap();localStorage.setItem("wallets-v1",lastSaved);render();setChip("Redone");refreshUndoButtons();syncNow()}}
function refreshUndoButtons(){var u=document.getElementById("undoBtn"),r=document.getElementById("redoBtn");if(u)u.disabled=!undoStack.length;if(r)r.disabled=!redoStack.length}
function addUndoButtons(){var top=document.querySelector(".top .tr");if(!top||document.getElementById("undoBtn"))return;var u=document.createElement("button");u.id="undoBtn";u.className="sm";u.textContent="↶";u.title="Undo";u.onclick=doUndo;var r=document.createElement("button");r.id="redoBtn";r.className="sm";r.textContent="↷";r.title="Redo";r.onclick=doRedo;top.insertBefore(u,top.firstChild);top.insertBefore(r,top.firstChild);refreshUndoButtons()}
function inr(n){return "₹"+Number(n).toLocaleString("en-IN")}
function bal(id){return S.tx.filter(function(t){return t.w===id}).reduce(function(a,t){var v=Number(t.amt)||0;return a+(t.type==="add"?v:-v)},0)}
function spentMonth(id){var d=new Date(),m=d.getMonth(),y=d.getFullYear();
return S.tx.filter(function(t){var x=new Date(t.t);return t.w===id&&t.type==="spend"&&x.getMonth()===m&&x.getFullYear()===y}).reduce(function(a,t){return a+t.amt},0)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
refreshUndoButtons();
var tot=0,list=document.getElementById("list");list.innerHTML="";
if(!S.wallets.length)list.appendChild(el("p","empty","No wallets yet. Tap New wallet and create one, like Room or Food."));
vis().forEach(function(w){
var b=bal(w.id);tot+=b;var sp=spentMonth(w.id);
var c=el("div","w");c.style.setProperty("--c",w.color);
var t=el("div","wt");t.appendChild(el("span","wn",w.name));t.appendChild(el("span","wb",inr(b)));c.appendChild(t);
if(w.limit>0){
var over=sp>w.limit,pc=Math.min(100,sp/w.limit*100);
var bar=el("div","bar"+(over?" over":""));var i=el("i");i.style.width=pc+"%";bar.appendChild(i);c.appendChild(bar);
c.appendChild(el("p","note"+(over?" over":""),over?"Over limit: "+inr(sp)+" spent of "+inr(w.limit)+" this month":inr(sp)+" spent of "+inr(w.limit)+" this month. "+inr(w.limit-sp)+" left."));
}else{c.appendChild(el("p","note",inr(sp)+" spent this month"));}
var r=el("div","row");
var a=el("button","pri","Add money");a.onclick=function(){sheet("add",w.id)};
var s=el("button","","Spend");s.onclick=function(){sheet("spend",w.id)};
var d=el("button","","Delete");d.onclick=function(){if(confirm("Delete "+w.name+" and ALL transactions in this wallet? This cannot be undone.")){S.wallets=S.wallets.filter(function(x){return x.id!==w.id});S.tx=S.tx.filter(function(x){return x.w!==w.id});save();render()}};
r.appendChild(a);r.appendChild(s);r.appendChild(d);c.appendChild(r);
var r2=el("div","row");r2.style.marginTop="8px";
var pb=el("button","","Pay by UPI");pb.onclick=function(){paySheet(w.id)};
var qb=el("button","","My QR");qb.onclick=function(){qrSheet(w.id)};
r2.appendChild(pb);r2.appendChild(qb);c.appendChild(r2);list.appendChild(c)});
document.getElementById("total").textContent=inr(tot);
var ms=vis().reduce(function(a,w){return a+spentMonth(w.id)},0);document.getElementById("msp").textContent="Spent this month: "+inr(ms);chips();payv();sstats();
var h=document.getElementById("hist");h.innerHTML="";
var ids=vis().map(function(w){return w.id});var q=(document.getElementById("hsearch")||{value:""}).value.trim().toLowerCase();var tx=S.tx.filter(function(t){if(ids.indexOf(t.w)<0)return false;var w=wal(t.w);return !q||String(t.note||"").toLowerCase().indexOf(q)>-1||String(w?w.name:"").toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.t-a.t}).slice(0,100);
if(!tx.length)h.appendChild(el("p","empty","No transactions yet."));
tx.forEach(function(t){
var w=S.wallets.filter(function(x){return x.id===t.w})[0];
var row=el("div","tx");var l=el("div");l.appendChild(el("b","",t.note||(t.type==="add"?"Money added":"Expense")));
l.appendChild(el("small","",(w?w.name:"")+", "+new Date(t.t).toLocaleDateString("en-IN",{day:"numeric",month:"short"})));
row.appendChild(l);
var rt=el("div");rt.style.display="flex";rt.style.alignItems="center";
rt.appendChild(el("span","amt "+(t.type==="add"?"in":"out"),(t.type==="add"?"+":"−")+inr(t.amt)));
var x=el("button","x","×");x.setAttribute("aria-label","Delete entry");x.onclick=function(){S.tx=S.tx.filter(function(y){return y.id!==t.id});save();render()};
rt.appendChild(x);row.appendChild(rt);h.appendChild(row)})}
var ov=document.getElementById("ov"),f=document.getElementById("f");
function close(){if(CAM){CAM();CAM=null}ov.classList.remove("on")}
ov.onclick=function(e){if(e.target===ov)close()};document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ov.classList.contains("on"))close()});
function sheet(mode,wid){
f.innerHTML="";var err=el("p","err");
if(mode==="new"){
f.appendChild(el("h3","","New wallet"));
f.appendChild(el("label","","Name"));var n=el("input");n.placeholder="Room";f.appendChild(n);
f.appendChild(el("label","","Monthly spending limit (optional)"));var l=el("input");l.type="number";l.inputMode="numeric";l.min="0";l.step="0.01";l.placeholder="500";f.appendChild(l);
f.appendChild(el("label","","Starting money from bank (optional)"));var st=el("input");st.type="number";st.inputMode="decimal";st.min="0";st.step="0.01";st.placeholder="2000";f.appendChild(st);
f.appendChild(err);
var b=el("button","pri","Create wallet");b.type="submit";b.style.width="100%";b.style.marginTop="12px";f.appendChild(b);
f.onsubmit=function(e){e.preventDefault();var nm=n.value.trim();if(!nm){err.textContent="Enter a wallet name.";return}
var lim=Number(l.value),start=Number(st.value);if(!Number.isFinite(lim)||lim<0||!Number.isFinite(start)||start<0){err.textContent="Enter valid non-negative amounts.";return}
var id="w"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.wallets.push({id:id,m:cur==="all"?"me":cur,name:nm,limit:lim,color:COLORS[S.wallets.length%COLORS.length]});
if(start>0)S.tx.push({id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),w:id,amt:start,type:"add",note:"Starting money",t:Date.now()});
save();close();render()};
n.focus();
}else{
var w=S.wallets.filter(function(x){return x.id===wid})[0];
