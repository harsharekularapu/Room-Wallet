:root{--bg:#0b1421;--panel:#111f30;--panel2:#17283b;--line:#263b50;--txt:#f2f7fb;--muted:#9bb0c4;--a:#4ed6b0;--a2:#20a98b;--red:#ff7777;--shadow:0 18px 50px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#1b3b50 0%,transparent 60%),var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 15px;background:var(--panel2);color:var(--txt);font-weight:650}button.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#06241e}button.ghost{border:1px solid var(--line);background:transparent}button.danger{color:#ffd0d0;border:1px solid #78434a;background:#351f2b}.wrap{max-width:980px;margin:auto;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 25px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:850;letter-spacing:-.5px}.brand img{width:42px;height:42px;border-radius:13px}.pill{font-size:12px;color:var(--a);background:#153c39;padding:6px 10px;border-radius:30px}.card{background:linear-gradient(145deg,#142438,#101d2d);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin:14px 0}.hero{padding:27px}.muted{color:var(--muted)}h1{font-size:clamp(26px,5vw,38px);letter-spacing:-1px;margin:0 0 8px}h2{font-size:20px;margin:0 0 15px}h3{margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;color:var(--muted)}input,select{width:100%;padding:13px 14px;color:var(--txt);background:#0b1725;border:1px solid var(--line);border-radius:12px;outline:none}input:focus,select:focus{border-color:var(--a)}.auth{max-width:460px;margin:7vh auto}.hidden{display:none!important}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button.active{background:#1b4a43;color:#a9ffe4;border:1px solid #2b8874}.stat{font-size:27px;font-weight:800;letter-spacing:-1px}.room{cursor:pointer;transition:.18s}.room:active{transform:scale(.985)}.room.selected{border-color:var(--a);box-shadow:0 0 0 1px #4ed6b044}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;background:#0c1928;border:1px solid #22364a;border-radius:13px}.small{font-size:12px}.positive{color:var(--a)}.negative{color:var(--red)}.notice{padding:12px 14px;border-radius:12px;background:#342b1b;color:#ffe2a8;margin:12px 0}.error{color:#ffaaaa;font-size:13px;min-height:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1421ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}.bottom button{min-width:72px;background:transparent;color:var(--muted);font-size:12px;padding:8px}.bottom button.active{color:var(--a);background:#173b39}.bottom span{display:block;font-size:19px;margin-bottom:2px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e8fff7;color:#073b30;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:20}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:end center;padding:15px;z-index:10}.modal>div{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;max-height:85vh;overflow:auto}.amount{font-variant-numeric:tabular-nums}.avatar{width:38px;height:38px;border-radius:50%;background:#24564e;display:grid;place-items:center;color:#b9ffea;font-weight:800}.footer{text-align:center;color:#6f879d;font-size:12px;margin-top:28px}@media(min-width:700px){.modal{place-items:center}}

</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="/icon-192.png" alt=""><span>RoomWallet</span></div><div id="userBadge" class="row hidden"><div class="avatar" id="avatar">H</div><span id="userName" class="small"></span></div></header>
<section id="authView" class="auth card"><h1>Money, together.</h1><p class="muted">Your own wallet. Your shared rooms. One simple place.</p><div class="tabs"><button id="tabLogin" class="active">Sign in</button><button id="tabRegister">Create account</button></div><form id="authForm"><div id="nameField" class="field hidden"><label>Your name</label><input id="name" maxlength="60" autocomplete="name" placeholder="e.g. Harsha"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"></div><p id="authError" class="error"></p><button class="primary" id="authSubmit" style="width:100%">Sign in</button></form></section>
<section id="appView" class="hidden"><section id="homePage"></section><section id="walletPage" class="hidden"></section><section id="statsPage" class="hidden"></section><section id="payPage" class="hidden"></section><section id="settingsPage" class="hidden"></section></section></main>
<nav id="bottomNav" class="bottom hidden"><button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="stats"><span>▥</span>Stats</button><button data-page="pay"><span>◎</span>Pay</button><button data-page="settings"><span>⚙</span>Settings</button></nav><div id="modal" class="modal hidden"><div id="modalBody"></div></div><div id="toast" class="toast hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const COLORS=['#0B7A6B','#2F5FC4','#B86E0A','#9A3E9B','#C23B22','#3C8021'],DAY=864e5,UPIRE=/^[\w.\-]{2,}@[\w]{2,}$/;
let token=localStorage.getItem('rw4-token')||'',me=null,personal={transactions:[],limit:0},rooms=[],invites=[],roomData={},cur='personal',page='home',tab='entries',stSpace='personal',stMonth='',authMode='login',backStack=[],CAM=null,syncing=false;
const isP=id=>id==='personal',R=id=>rooms.find(r=>r.id===id),spaceName=id=>isP(id)?'My Wallet':(R(id)?.name||'Room');
const pot=l=>l.reduce((a,t)=>a+(t.type==='income'?t.amount:t.type==='expense'?-t.amount:0),0);
const mStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const mspent=l=>{const ms=mStart();return l.filter(t=>t.type==='expense'&&t.createdAt>=ms).reduce((a,t)=>a+t.amount,0)};
const txs=id=>isP(id)?personal.transactions:(roomData[id]?.transactions||[]);
const bal=id=>isP(id)?pot(personal.transactions):(R(id)?.pot||0),lim=id=>isP(id)?(personal.limit||0):(R(id)?.limit||0),spent=id=>isP(id)?mspent(personal.transactions):(R(id)?.monthSpent||0);
const members=id=>R(id)?.members||[],mname=(id,uid)=>members(id).find(m=>m.userId===uid)?.name||'Former member',myRole=id=>members(id).find(m=>m.userId===me.id)?.role;
const isAdmin=id=>isP(id)||myRole(id)!=='member';
async function api(path,o={}){const r=await fetch('/api'+path,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401&&token){showAuth()}const e=Error(d.error||'Request failed');e.code=d.code;e.status=r.status;throw e}return d}
function toast(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}
function showAuth(){token='';localStorage.removeItem('rw4-token');['appView','bottomNav','userBadge'].forEach(x=>$(x).classList.add('hidden'));$('authView').classList.remove('hidden')}
function setAuthMode(m){authMode=m;$('tabLogin').classList.toggle('active',m==='login');$('tabRegister').classList.toggle('active',m==='register');$('nameField').classList.toggle('hidden',m!=='register');$('authSubmit').textContent=m==='login'?'Sign in':'Create account';$('password').autocomplete=m==='login'?'current-password':'new-password';$('authError').textContent=''}
$('tabLogin').onclick=()=>setAuthMode('login');$('tabRegister').onclick=()=>setAuthMode('register');
$('authForm').onsubmit=async e=>{e.preventDefault();$('authSubmit').disabled=true;try{const d=await api(authMode==='login'?'/login':'/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('rw4-token',token);await start()}catch(x){$('authError').textContent=x.message}finally{$('authSubmit').disabled=false}};
function applyMe(d){me=d.user;personal=d.personal;rooms=d.rooms;invites=d.invites;$('userName').textContent=me.name;$('avatar').textContent=me.name[0].toUpperCase()}
async function start(){applyMe(await api('/me'));['authView'].forEach(x=>$(x).classList.add('hidden'));['appView','bottomNav','userBadge'].forEach(x=>$(x).classList.remove('hidden'));navigate('home',false);resumePay()}
async function sync(sp){if(isP(sp)||!sp)applyMe(await api('/me'));else{const d=await api('/rooms/'+sp);roomData[sp]=d;rooms=rooms.map(r=>r.id===sp?d.room:r)}renderPage()}
async function refresh(){if(!token||document.hidden||!$('modal').classList.contains('hidden')||syncing)return;syncing=true;try{applyMe(await api('/me'));if(!isP(cur)&&!R(cur)){cur='personal';navigate('home',false)}const ids=new Set([cur,stSpace]);for(const id of ids)if(!isP(id)&&R(id))roomData[id]=await api('/rooms/'+id);for(const r of rooms)if(roomData[r.id])rooms=rooms.map(x=>x.id===r.id?roomData[r.id].room:x);renderPage()}catch{}finally{syncing=false}}
setInterval(refresh,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
function navigate(p,push=true){if(push&&p!==page){backStack.push(page);history.pushState({rw:1},'','#app')}page=p;['home','wallet','stats','pay','settings'].forEach(x=>$(x+'Page').classList.toggle('hidden',p!==x));document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===(p==='wallet'?'home':p)));renderPage();window.scrollTo(0,0)}
function renderPage(){({home:renderHome,wallet:renderWallet,stats:renderStats,pay:renderPay,settings:renderSettings})[page]()}
function limitBar(id){const l=lim(id),s=spent(id);if(!l)return `<p class="note">${money(s)} spent this month</p>`;const over=s>l;return `<div class="bar${over?' over':''}"><i style="width:${Math.min(100,s/l*100)}%"></i></div><p class="note${over?' over':''}">${over?'Over limit: ':''}${money(s)} of ${money(l)} spent this month${over?'':'. '+money(l-s)+' left'}</p>`}
function renderHome(){const all=[{id:'personal',name:'My Wallet',sub:'Only you can see this'}].concat(rooms.map(r=>({id:r.id,name:r.name,sub:r.memberCount+' member(s) · '+r.roomCode})));const total=all.reduce((a,c)=>a+bal(c.id),0);
$('homePage').innerHTML=`<section class="card hero"><p class="muted small">Hi, ${esc(me.name)} 👋</p><div class="stat amount">${money(total)}</div><p class="muted small">Total across your spaces</p><div class="row"><span class="small muted">Account ID</span><strong>${esc(me.accountId)}</strong><button class="ghost small" data-a="copyId">Copy</button></div></section>
<div class="row between"><h2>Your spaces</h2><button class="primary" data-a="newRoom">＋ Room</button></div><div class="grid">${all.map((c,i)=>`<article class="sp" style="--c:${COLORS[i%6]}" data-a="open" data-id="${esc(c.id)}"><div class="wt"><b>${esc(c.name)}</b><span class="amount big2">${money(bal(c.id))}</span></div><p class="note">${esc(c.sub)}</p>${limitBar(c.id)}</article>`).join('')}</div>
<div class="card"><h2>Pending invitations</h2>${invites.length?invites.map(i=>`<div class="item"><div><strong>${esc(i.roomName)}</strong><div class="muted small">Invited by ${esc(i.fromName||'member')}</div></div><div class="row"><button class="primary" data-a="inv" data-id="${esc(i.id)}" data-v="accept">Accept</button><button class="ghost" data-a="inv" data-id="${esc(i.id)}" data-v="decline">Decline</button></div></div>`).join(''):'<p class="muted small">No pending invitations.</p>'}</div>`}
function txRow(t,id){let amt,cls,sub=esc(t.by||'You');if(t.type==='income'){amt='+'+money(t.amount);cls='positive'}else if(t.type==='expense'){amt='−'+money(t.amount);cls='negative'}else if(t.type==='split'){amt=money(t.amount);cls='split';sub=`Paid by ${esc(mname(id,t.split.paidBy))} · split ${t.split.among.length} way`}else{amt=money(t.amount);cls='split';sub=`${esc(mname(id,t.settle.from))} paid ${esc(mname(id,t.settle.to))}`}
const del=isP(id)||t.userId===me.id||isAdmin(id);const tag={income:'Added',expense:'Spent',split:'Split bill',settle:'Settled'}[t.type];
return `<div class="item"><div><strong>${esc(t.description)}</strong><div class="muted small">${tag} · ${sub} · ${new Date(t.createdAt).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div><div class="row"><strong class="amount ${cls}">${amt}</strong>${del?`<button class="x" data-a="delTx" data-id="${esc(t.id)}" aria-label="Delete entry">×</button>`:''}</div></div>`}
function renderWallet(){const id=cur,P=isP(id);if(!P&&!R(id)){cur='personal';navigate('home',false);return}const rd=roomData[id],st=rd?.stats;
let body='';
if(tab==='entries'||P){const l=[...txs(id)].reverse();body=l.length?`<div class="list">${l.slice(0,300).map(t=>txRow(t,id)).join('')}</div>`:'<p class="muted">No entries yet.</p>'}
else if(tab==='balances'&&st){const n=st.members;body=`<div class="list">${n.map(m=>`<div class="item"><div><strong>${esc(m.name)}${m.userId===me.id?' (you)':''}</strong><div class="muted small">Added ${money(m.contributed)} · Spent ${money(m.spent)}</div></div><strong class="amount ${m.net>0.009?'positive':m.net<-0.009?'negative':'muted'}">${m.net>0.009?'gets '+money(m.net):m.net<-0.009?'owes '+money(-m.net):'settled'}</strong></div>`).join('')}</div><h2 style="margin-top:18px">Who owes whom</h2>${st.debts.length?`<div class="list">${st.debts.map(d=>`<div class="item"><div><strong>${esc(mname(id,d.from))} → ${esc(mname(id,d.to))}</strong></div><div class="row"><strong class="amount">${money(d.amount)}</strong>${d.from===me.id?`<button class="primary small" data-a="settleTo" data-to="${esc(d.to)}" data-amt="${d.amount}">Settle</button>`:''}</div></div>`).join('')}</div>`:'<p class="muted small">Everyone is settled up. 🎉</p>'}`}
else if(tab==='members'){const r=R(id),mine=myRole(id);body=`<div class="list">${r.members.map(m=>`<div class="item"><div><strong>${esc(m.name||'Member')}${m.userId===me.id?' (you)':''}</strong><div class="muted small">${esc(m.accountId||'')} · ${esc(m.role)}</div></div><div class="row">${mine==='owner'&&m.role!=='owner'?`<button class="ghost small" data-a="setRole" data-id="${esc(m.userId)}" data-v="${m.role==='admin'?'member':'admin'}">${m.role==='admin'?'Make member':'Make admin'}</button><button class="ghost small" data-a="transfer" data-id="${esc(m.userId)}">Make owner</button>`:''}${mine!=='member'&&m.role!=='owner'&&m.userId!==me.id&&(mine==='owner'||m.role==='member')?`<button class="danger small" data-a="removeMember" data-id="${esc(m.userId)}">Remove</button>`:''}</div></div>`).join('')}</div><div class="row" style="margin-top:14px">${mine!=='member'?'<button class="primary" data-a="invite">＋ Invite by Account ID</button><button class="ghost" data-a="editRoom">Edit room</button>':''}${mine==='owner'?'<button class="danger" data-a="delRoom">Delete room</button>':'<button class="danger" data-a="leave">Leave room</button>'}</div>`}
else body='<p class="muted">Loading…</p>';
$('walletPage').innerHTML=`<div class="row between"><div><p class="muted small">${P?'PERSONAL WALLET':'SHARED ROOM · '+esc(R(id).roomCode)}</p><h2>${esc(spaceName(id))}</h2></div><button class="ghost" data-a="back">← Back</button></div>
<div class="card hero2" style="--c:${COLORS[(isP(id)?0:rooms.findIndex(r=>r.id===id)+1)%6]}"><p class="note">${P?'Available balance':'Room pot balance'}</p><div class="stat amount">${money(bal(id))}</div>${limitBar(id)}<div class="row" style="margin-top:10px"><button class="ghost" data-a="tx" data-k="income">＋ Add money</button><button class="ghost" data-a="tx" data-k="expense">− Spend</button>${P?'':'<button class="ghost" data-a="tx" data-k="split">⇄ Split bill</button><button class="ghost" data-a="tx" data-k="settle">✓ Settle up</button>'}<button class="ghost" data-a="payScan" data-id="${esc(id)}">Pay by UPI</button><button class="ghost" data-a="myQr">My QR</button>${P?'<button class="ghost" data-a="setLimit">Set limit</button>':''}</div></div>
${P?'':`<div class="tabs">${['entries','balances','members'].map(t=>`<button class="${tab===t?'active':''}" data-a="tab" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`}<div class="card">${P?'<h2>Entries</h2>':''}${body}</div>`}
function monthTx(id,mo){const [y,m]=mo.split('-').map(Number),a=new Date(y,m-1,1).getTime(),b=new Date(y,m,1).getTime();return txs(id).filter(t=>(t.type==='expense'||t.type==='split')&&t.createdAt>=a&&t.createdAt<b)}
async function renderStats(){if(!stMonth){const d=new Date();stMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}if(!isP(stSpace)&&!R(stSpace))stSpace='personal';if(!isP(stSpace)&&!roomData[stSpace]){try{roomData[stSpace]=await api('/rooms/'+stSpace)}catch{}}
const all=txs(stSpace).filter(t=>t.type==='expense'||t.type==='split'),sum=l=>l.reduce((a,t)=>a+t.amount,0),now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),wk=d0-((now.getDay()+6)%7)*DAY,mt=monthTx(stSpace,stMonth),inRange=(a,b)=>sum(all.filter(t=>t.createdAt>=a&&t.createdAt<b));
const days=[];for(let i=6;i>=0;i--){const s=d0-i*DAY;days.push({s,v:inRange(s,s+DAY)})}const mx=Math.max(1,...days.map(d=>d.v));
const grp={};[...mt].sort((a,b)=>b.createdAt-a.createdAt).forEach(t=>{const k=new Date(t.createdAt).toDateString();(grp[k]=grp[k]||[]).push(t)});
const by={};if(!isP(stSpace))mt.forEach(t=>{const k=t.type==='split'?t.split.paidBy:t.userId;by[k]=(by[k]||0)+t.amount});
$('statsPage').innerHTML=`<h2>Spending</h2><div class="row"><select id="stSel" style="flex:1">${[['personal','My Wallet']].concat(rooms.map(r=>[r.id,r.name])).map(([v,n])=>`<option value="${esc(v)}" ${v===stSpace?'selected':''}>${esc(n)}</option>`).join('')}</select><input id="stMon" type="month" value="${stMonth}" style="flex:1"></div>
<div class="sg"><div class="sc2"><small>Today</small><b>${money(inRange(d0,d0+DAY))}</b></div><div class="sc2"><small>This week</small><b>${money(inRange(wk,wk+7*DAY))}</b></div><div class="sc2 hi"><small>${stMonth}</small><b>${money(sum(mt))}</b></div></div>
<p class="note">Daily average in selected month: ${money(sum(mt)/(stMonth===now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')?now.getDate():new Date(+stMonth.slice(0,4),+stMonth.slice(5),0).getDate()))}</p>
<h2>Last 7 days</h2><div class="ch">${days.map((d,i)=>`<div class="cc${i===6?' td':''}"><span class="cv">${d.v?'₹'+Math.round(d.v):''}</span><i style="height:${Math.max(3,d.v/mx*100)}px"></i><span class="cl">${new Date(d.s).toLocaleDateString('en-IN',{weekday:'short'})}</span></div>`).join('')}</div>
${isP(stSpace)?'':`<h2 style="margin-top:18px">Spent by member</h2><div class="list">${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class="item"><strong>${esc(mname(stSpace,k))}</strong><strong class="amount">${money(v)}</strong></div>`).join(''):'<p class="muted small">No spending this month.</p>'}</div>`}
<h2 style="margin-top:18px">Day by day</h2>${Object.keys(grp).length?Object.entries(grp).map(([k,l])=>{const dd=new Date(k),lab=dd.getTime()===d0?'Today':dd.getTime()===d0-DAY?'Yesterday':dd.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});return `<div class="dh"><span>${lab}</span><span>${money(sum(l))}</span></div><div class="list">${l.map(t=>`<div class="item"><div><strong>${esc(t.description)}</strong><div class="muted small">${t.type==='split'?'Split bill':'Spent'} · ${esc(isP(stSpace)?'You':t.by||'')}</div></div><strong class="amount negative">−${money(t.amount)}</strong></div>`).join('')}</div>`}).join(''):'<p class="muted">No spending in this month.</p>'}`;
$('stSel').onchange=e=>{stSpace=e.target.value;renderStats()};$('stMon').onchange=e=>{if(e.target.value){stMonth=e.target.value;renderStats()}}}
function renderPay(){const all=[{id:'personal',name:'My Wallet'}].concat(rooms);$('payPage').innerHTML=`<h2>Scan and pay</h2><div class="card"><p class="muted small">Pick the wallet this payment comes from. The app opens your UPI app (GPay, PhonePe...). Money still leaves your bank account, and RoomWallet records it after you confirm.</p><div class="field"><label>Pay from</label><select id="paySel">${all.map(c=>`<option value="${esc(c.id)}" ${c.id===cur?'selected':''}>${esc(c.name)} (${money(bal(c.id))})</option>`).join('')}</select></div><button class="primary big" style="width:100%;padding:18px;font-size:18px" data-a="payScanSel">Scan and pay</button><p class="muted small">Paying to a phone number? Pay in your UPI app, then add it with Spend inside the wallet.</p></div>`}
function renderSettings(){$('settingsPage').innerHTML=`<h1>Settings</h1><div class="card"><h2>Profile</h2><div class="field"><label>Display name</label><input id="pName" value="${esc(me.name)}"></div><div class="field"><label>My UPI ID (for My QR)</label><input id="pUpi" value="${esc(me.upi)}" placeholder="name@bank"></div><div class="field"><label>Account ID</label><input value="${esc(me.accountId)}" readonly></div><button class="primary" data-a="saveProfile">Save profile</button></div>
<div class="card"><h2>Backup</h2><p class="muted small">Your data lives on the server. Still, download a backup at the end of each month.</p><div class="row"><button class="primary" data-a="backup">Download backup (JSON)</button><button class="ghost" data-a="csv">Download CSV</button></div><div class="field"><label>Restore personal wallet from a backup file</label><input type="file" id="rest" accept=".json,application/json"></div></div>
<div class="card"><h2>Account</h2><button class="danger" data-a="logout">Sign out</button></div><p class="footer">RoomWallet V4</p>`;$('rest').onchange=restore}
function openModal(title,html,submit,btn='Continue'){$('modalBody').innerHTML=`<div class="row between"><h2>${title}</h2><button class="ghost" data-a="closeModal">✕</button></div><form id="mf">${html}<p id="merr" class="error"></p>${submit?`<button class="primary" style="width:100%">${btn}</button>`:''}</form>`;$('modal').classList.remove('hidden');const f=$('mf');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button.primary');if(b)b.disabled=true;try{await submit(new FormData(f),f)}catch(x){$('merr').textContent=x.message}finally{if(b)b.disabled=false}};const i=f.querySelector('input:not([type=checkbox]):not([readonly]),select');if(i&&!matchMedia('(pointer:coarse)').matches)i.focus();return f}
function closeModal(){if(CAM){CAM();CAM=null}$('modal').classList.add('hidden')}
const done=m=>{closeModal();if(m)toast(m)};
async function postTx(sp,body){const go=force=>isP(sp)?api('/personal/tx',{method:'POST',body:JSON.stringify({...body,force})}):api('/rooms/'+sp+'/tx',{method:'POST',body:JSON.stringify({...body,force})});try{await go(false)}catch(e){if((e.code==='LIMIT'||e.code==='LOW')&&confirm(e.message+' Record it anyway?'))await go(true);else throw e}await sync(sp)}
const fld=(l,n,x='')=>`<div class="field"><label>${l}</label><input name="${n}" ${x}></div>`;
function txModal(k,pre={}){const id=cur,mem=members(id).filter(m=>m.userId!==me.id),all=members(id);
const t={income:'Add money',expense:'Spend',split:'Split a bill',settle:'Settle up'}[k];
let h=fld('Amount (₹)','amount',`type="number" min="0.01" step="0.01" required value="${pre.amt||''}"`);
if(k==='settle'){if(!mem.length){toast('No other members yet');return}h=`<div class="field"><label>Pay to</label><select name="to">${mem.map(m=>`<option value="${esc(m.userId)}" ${m.userId===pre.to?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`+h+'<p class="muted small">Pay them in your UPI app first, then record it here.</p>'}
else{h+=fld('Description','description',`maxlength="100" placeholder="${k==='income'?'Transferred from bank':k==='split'?'Groceries, electricity bill...':'Rent share, tea, auto'}"`)}
if(k==='split')h+=`<div class="field"><label>Paid by</label><select name="paidBy">${all.map(m=>`<option value="${esc(m.userId)}" ${m.userId===me.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Shared equally among</label>${all.map(m=>`<label class="chk"><input type="checkbox" name="among" value="${esc(m.userId)}" checked> ${esc(m.name)}</label>`).join('')}</div>`;
openModal(t,h,async f=>{const body={type:k,amount:Number(f.get('amount')),description:f.get('description')||''};if(k==='split'){body.paidBy=f.get('paidBy');body.among=f.getAll('among')}if(k==='settle')body.to=f.get('to');await postTx(id,body);done('Saved')})}
function payModal(sp){let SC='';const f=openModal('Pay from '+esc(spaceName(sp)),`<video id="vid" playsinline muted style="display:none;width:100%;border-radius:10px"></video><button type="button" class="ghost" style="width:100%" id="scanBtn">Scan payee QR</button>${fld('UPI ID','upi','placeholder="name@bank" autocapitalize="off"')}${fld('Payee name (optional)','pn')}${fld('Amount (₹)','am','type="number" min="0.01" step="0.01" required')}${fld('Note','note','maxlength="100"')}`,async f=>{const id=f.get('upi').trim(),v=Math.round(Number(f.get('am'))*100)/100;if(!UPIRE.test(id))throw Error('Enter a valid UPI ID like name@bank.');if(!(v>0))throw Error('Enter an amount greater than 0.');if(v>bal(sp))throw Error('Not enough money. '+spaceName(sp)+' has '+money(bal(sp))+'.');if(lim(sp)>0&&spent(sp)+v>lim(sp))throw Error('Monthly limit of '+money(lim(sp))+' reached.');
const note=(f.get('note')||f.get('pn')||id).trim();let link;if(SC&&parseUpi(SC).pa===id){const uu=new URL(SC.replace(/^upi:\/\//i,'https://x/'));uu.searchParams.set('am',v.toFixed(2));uu.searchParams.set('cu','INR');if(f.get('note'))uu.searchParams.set('tn',f.get('note'));link='upi://'+uu.pathname.replace(/^\//,'')+uu.search.replace(/\+/g,'%20')}else link='upi://pay?pa='+encodeURIComponent(id)+'&pn='+encodeURIComponent(f.get('pn')||'Payee')+'&am='+v.toFixed(2)+'&cu=INR&tn='+encodeURIComponent(f.get('note')||spaceName(sp));
const pend={sp,amount:v,note,t:Date.now()};localStorage.setItem('rw4-pending',JSON.stringify(pend));if(CAM){CAM();CAM=null}payConfirm(pend);location.href=link},'Open UPI app');
$('scanBtn').onclick=()=>{const vid=$('vid');if(!navigator.mediaDevices){$('merr').textContent='Camera not available. Paste the UPI ID.';return}navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{CAM=()=>{s.getTracks().forEach(t=>t.stop());vid.style.display='none'};vid.srcObject=s;vid.style.display='block';vid.play();const cv=document.createElement('canvas'),cx=cv.getContext('2d');(function tick(){if(!CAM)return;if(vid.videoWidth&&window.jsQR){cv.width=vid.videoWidth;cv.height=vid.videoHeight;cx.drawImage(vid,0,0);const d=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height);if(r&&/^upi:/i.test(r.data)){const p=parseUpi(r.data);SC=r.data;f.upi.value=p.pa;f.pn.value=p.pn;if(p.am)f.am.value=p.am;CAM();CAM=null;return}}requestAnimationFrame(tick)})()}).catch(()=>{$('merr').textContent='Camera blocked. Paste the UPI ID instead.'})}}
function parseUpi(s){s=s.trim();if(/^upi:/i.test(s)){try{const u=new URL(s.replace(/^upi:\/\//i,'https://x/'));return{pa:u.searchParams.get('pa')||'',pn:u.searchParams.get('pn')||'',am:u.searchParams.get('am')||''}}catch{}}return{pa:s,pn:'',am:''}}
function payConfirm(p){openModal('Did the payment go through?',`<p class="muted small">If no UPI app opened, pay in GPay or PhonePe yourself, then tap Yes. ${money(p.amount)} will be recorded as spent from ${esc(spaceName(p.sp))}.</p><button type="button" class="primary" style="width:100%" id="payYes">Yes, record expense</button><button type="button" class="ghost" style="width:100%;margin-top:10px" id="payNo">No, cancel</button>`,null);
$('payYes').onclick=async()=>{try{await postTx(p.sp,{type:'expense',amount:p.amount,description:p.note});localStorage.removeItem('rw4-pending');done('Payment recorded')}catch(e){$('merr').textContent=e.message}};$('payNo').onclick=()=>{localStorage.removeItem('rw4-pending');done()}}
function resumePay(){try{const p=JSON.parse(localStorage.getItem('rw4-pending')||'null');if(p&&Date.now()-p.t<108e5&&(isP(p.sp)||R(p.sp)))payConfirm(p);else localStorage.removeItem('rw4-pending')}catch{localStorage.removeItem('rw4-pending')}}
function qrModal(){const id=cur;openModal('Receive into '+esc(spaceName(id)),`${me.upi?'':'<p class="muted small">Save your UPI ID first (Settings, Profile).</p>'}${fld('Amount (optional)','am','type="number" min="0.01" step="0.01"')}<div id="qrBox" style="display:none;background:#fff;padding:12px;border-radius:12px;text-align:center;margin:10px 0"></div><p class="muted small" id="qrTip" style="display:none">The payer scans this. Money lands in your bank account. When it arrives, tap Mark received.</p><button type="button" class="ghost" style="width:100%" id="markRec">Mark received in wallet</button>`,async f=>{if(!me.upi)throw Error('Save your UPI ID in Settings first.');if(!window.qrcode)throw Error('QR needs internet. Connect and try again.');const a=Number(f.get('am')),l='upi://pay?pa='+encodeURIComponent(me.upi)+'&pn='+encodeURIComponent(me.name)+'&cu=INR&tn='+encodeURIComponent(spaceName(id))+(a>0?'&am='+a.toFixed(2):'');const q=qrcode(0,'M');q.addData(l);q.make();$('qrBox').innerHTML=q.createSvgTag(5);const s=$('qrBox').firstChild;s.style.maxWidth='100%';s.style.height='auto';$('qrBox').style.display='block';$('qrTip').style.display='block'},'Show QR');
$('markRec').onclick=async()=>{const a=Number($('mf').am.value);if(!(a>0)){$('merr').textContent='Enter the amount you received.';return}try{await postTx(id,{type:'income',amount:a,description:'Received via QR'});done('Added to wallet')}catch(e){$('merr').textContent=e.message}}}
function dl(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const stamp=()=>new Date().toISOString().slice(0,10);
async function restore(e){const fl=e.target.files[0];if(!fl)return;try{const o=JSON.parse(await fl.text()),l=o.personal?.transactions||o.transactions;if(!Array.isArray(l))throw 0;if(!confirm('Replace your personal wallet entries with this backup?'))return;await api('/personal/import',{method:'POST',body:JSON.stringify({transactions:l,limit:o.personal?.limit})});await sync('personal');toast('Restored')}catch(x){toast(x.message&&x.message!=='0'?x.message:'That file is not a valid backup')}}
const acts={
 copyId:async()=>{try{await navigator.clipboard.writeText(me.accountId);toast('Account ID copied')}catch{toast(me.accountId)}},
 open:async d=>{cur=d.id;tab='entries';if(!isP(cur))try{roomData[cur]=await api('/rooms/'+cur);rooms=rooms.map(r=>r.id===cur?roomData[cur].room:r)}catch(e){toast(e.message);return}navigate('wallet')},
 back:()=>back(),closeModal:()=>closeModal(),
 newRoom:()=>openModal('Create shared room',fld('Room name','name','required minlength="2" maxlength="60" placeholder="e.g. Boys Room"')+fld('Monthly spending limit (optional)','limit','type="number" min="0" placeholder="e.g. 5000"')+'<p class="muted small">You can invite friends later using their Account IDs.</p>',async f=>{const d=await api('/rooms',{method:'POST',body:JSON.stringify({name:f.get('name'),limit:Number(f.get('limit')||0)})});await sync('personal');done('Room created');cur=d.room.id;await acts.open({id:cur})}),
 inv:async d=>{try{await api('/invites/'+d.id,{method:'POST',body:JSON.stringify({action:d.v})});await sync('personal');toast(d.v==='accept'?'Joined room':'Declined')}catch(e){toast(e.message)}},
 tx:d=>txModal(d.k),settleTo:d=>txModal('settle',{to:d.to,amt:d.amt}),
 tab:d=>{tab=d.v;renderWallet()},
 delTx:async d=>{if(!confirm('Delete this entry?'))return;try{await api(isP(cur)?'/personal/tx/'+d.id:'/rooms/'+cur+'/tx/'+d.id,{method:'DELETE'});await sync(cur);toast('Deleted')}catch(e){toast(e.message)}},
 setLimit:()=>openModal('Monthly limit',fld('Limit (₹, 0 for none)','limit',`type="number" min="0" value="${personal.limit||0}"`),async f=>{await api('/personal',{method:'PATCH',body:JSON.stringify({limit:Number(f.get('limit'))})});await sync('personal');done('Limit saved')}),
 editRoom:()=>openModal('Edit room',fld('Room name','name',`required minlength="2" maxlength="60" value="${esc(R(cur).name)}"`)+fld('Monthly limit (₹, 0 for none)','limit',`type="number" min="0" value="${R(cur).limit||0}"`),async f=>{await api('/rooms/'+cur,{method:'PATCH',body:JSON.stringify({name:f.get('name'),limit:Number(f.get('limit')||0)})});await sync(cur);done('Room updated')}),
 invite:()=>openModal('Invite by Account ID',fld('Friend’s Account ID','accountId','required placeholder="RW-XXXXXXXX" autocapitalize="characters"')+'<p class="muted small">Your friend needs a RoomWallet account and must accept the invitation.</p>',async f=>{await api('/rooms/'+cur+'/invite',{method:'POST',body:JSON.stringify({accountId:f.get('accountId')})});done('Invitation sent')}),
 removeMember:async d=>{if(!confirm('Remove this member from the room?'))return;try{await api('/rooms/'+cur+'/members/'+d.id,{method:'DELETE'});await sync(cur);toast('Removed')}catch(e){toast(e.message)}},
 setRole:async d=>{try{await api('/rooms/'+cur+'/members/'+d.id,{method:'PATCH',body:JSON.stringify({role:d.v})});await sync(cur)}catch(e){toast(e.message)}},
 transfer:async d=>{if(!confirm('Make this member the room owner? You become an admin.'))return;try{await api('/rooms/'+cur+'/transfer',{method:'POST',body:JSON.stringify({userId:d.id})});await sync(cur)}catch(e){toast(e.message)}},
 leave:async()=>{if(!confirm('Leave this room?'))return;try{await api('/rooms/'+cur+'/leave',{method:'POST'});cur='personal';await sync('personal');navigate('home',false);toast('Left room')}catch(e){toast(e.message)}},
 delRoom:async()=>{if(!confirm('Delete this room and all its entries for everyone? This cannot be undone.'))return;try{await api('/rooms/'+cur,{method:'DELETE'});cur='personal';await sync('personal');navigate('home',false);toast('Room deleted')}catch(e){toast(e.message)}},
 payScan:d=>payModal(d.id),payScanSel:()=>payModal($('paySel').value),myQr:qrModal,
 saveProfile:async()=>{try{const d=await api('/profile',{method:'PATCH',body:JSON.stringify({name:$('pName').value,upi:$('pUpi').value})});me=d.user;$('userName').textContent=me.name;$('avatar').textContent=me.name[0].toUpperCase();toast('Profile saved')}catch(e){toast(e.message)}},
 backup:async()=>{try{dl('roomwallet-backup-'+stamp()+'.json',JSON.stringify(await api('/export'),null,1),'application/json')}catch(e){toast(e.message)}},
 csv:async()=>{try{const d=await api('/export'),rows=[['space','date','type','amount','description','by']];d.personal.transactions.forEach(t=>rows.push(['Personal',new Date(t.createdAt).toISOString().slice(0,10),t.type,t.amount,t.description,'']));d.rooms.forEach(r=>r.transactions.forEach(t=>rows.push([r.name,new Date(t.createdAt).toISOString().slice(0,10),t.type,t.amount,t.description,t.by||''])));dl('roomwallet-entries-'+stamp()+'.csv',rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}catch(e){toast(e.message)}},
 logout:async()=>{try{await api('/logout',{method:'POST'})}catch{}showAuth();setAuthMode('login')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&acts[b.dataset.a]){e.preventDefault();acts[b.dataset.a]({...b.dataset})}});
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function back(){if(!$('modal').classList.contains('hidden')){closeModal();return true}if(page!=='home'){navigate(backStack.pop()||'home',false);return true}return false}
window.addEventListener('popstate',()=>{if(back())history.pushState({rw:1},'','#app')});history.pushState({rw:1},'','#app');document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});if(token){try{await start()}catch{showAuth()}}})();
</script></body></html>
